# Docker Compose for Dokploy.
# Dokploy injects the network + Traefik labels via its UI; this file is the
# fallback / reference manifest for local testing and clean reproduction.
services:
  mia-website:
    build:
      context: .
      dockerfile: Dockerfile
      # Build-time env passthrough. NEXT_PUBLIC_* values are baked into the static
      # bundle, so they MUST be present at `docker build` time (not just runtime).
      # Values come from the environment / Dokploy build secrets — never hardcode
      # token values here. Only the Browser Token is ever passed client-side;
      # the Server Token and Client Secret must NEVER appear in this file.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://miasanabriarealtor.trueidea.com}
        NEXT_PUBLIC_BRIDGE_BROWSER_TOKEN: ${NEXT_PUBLIC_BRIDGE_BROWSER_TOKEN:-}
        NEXT_PUBLIC_BRIDGE_DATASET_ID: ${NEXT_PUBLIC_BRIDGE_DATASET_ID:-}
        NEXT_PUBLIC_BRIDGE_RESOURCE_PATH: ${NEXT_PUBLIC_BRIDGE_RESOURCE_PATH:-idx/Properties}
        NEXT_PUBLIC_BRIDGE_DEMO: ${NEXT_PUBLIC_BRIDGE_DEMO:-false}
        NEXT_PUBLIC_BRIDGE_MEDIA_HOSTS: ${NEXT_PUBLIC_BRIDGE_MEDIA_HOSTS:-}
    container_name: mia-website
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.mia-website.rule=Host(`miasanabriarealtor.trueidea.com`)
      - traefik.http.routers.mia-website.entrypoints=websecure
      - traefik.http.routers.mia-website.tls=true
      - traefik.http.routers.mia-website.tls.certresolver=letsencrypt
      - traefik.http.services.mia-website.loadbalancer.server.port=80
      - traefik.http.routers.mia-website-http.rule=Host(`miasanabriarealtor.trueidea.com`)
      - traefik.http.routers.mia-website-http.entrypoints=web
      - traefik.http.routers.mia-website-http.middlewares=mia-website-redirect@docker
      - traefik.http.middlewares.mia-website-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.mia-website-redirect.redirectscheme.permanent=true
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
